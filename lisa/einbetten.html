<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lisa — Zimmerrundgang</title>

<style>
/* ===========================================================================
   einbetten.html — die Führung zum Einbauen in eine fremde Seite.

   Unterschied zu index.html: kein Titelblock, kein Scrollteil, keine
   Doku. Nur der Rundgang selbst, und er füllt genau das Fenster aus, in
   das ein Hotel ihn setzt. Alles andere waere in einem Kasten auf einer
   fremden Seite nur im Weg.

   Zimmerdaten, Ton und Bilder kommen aus denselben Dateien wie die
   grosse Fassung. Ein Zimmer, zwei Auslieferungen.
   ======================================================================== */

:root{
  --tinte:#f4f5f7; --tinte-leise:#8b9099; --grund:#08090b;
  --haar-hell:rgba(244,245,247,.22); --akzent:#e8c8a0;
  --sans:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --weich:cubic-bezier(.22,.61,.36,1);
  --tief:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--grund);overflow:hidden}
body{font-family:var(--sans);color:var(--tinte);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[data-de],[data-en]{display:none}
html[lang="de"] [data-de],html[lang="en"] [data-en]{display:revert}

.rahmen{position:relative;width:100%;height:100%;overflow:hidden;background:#000}

/* Weichgezeichneter Auszug fuellt die Raender, wenn das Fenster nicht
   16:9 ist. Sonst stehen dort schwarze Balken wie ein Fehler. */
.rand{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
      transform:scale(1.2);filter:blur(38px) saturate(1.1) brightness(.42);
      opacity:0;transition:opacity 1s var(--weich)}
.rand.da{opacity:1}

video,.stand{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1}
.stand{z-index:2;transition:opacity .7s var(--weich)}
.stand.weg{opacity:0;pointer-events:none}

.dunkel{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.84) 0%,rgba(0,0,0,.18) 24%,transparent 44%),
             linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 20%)}

.tippen{position:absolute;inset:0;z-index:4}

/* ------------------------------------------------------------- Der Knopf */
.knopf{
  position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);
  width:clamp(72px,13vw,124px);height:clamp(72px,13vw,124px);
  display:grid;place-items:center;border-radius:50%;opacity:.46;
  transition:opacity .55s var(--weich),transform .55s var(--tief);
}
.knopf:hover,.knopf:focus-visible{opacity:.96;transform:translate(-50%,-50%) scale(1.05)}
.knopf:focus-visible{outline:1px solid var(--tinte);outline-offset:12px}
.knopf.weg{opacity:0;visibility:hidden;pointer-events:none}
.knopf::before{content:"";position:absolute;inset:-58%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(4,5,7,.6) 0%,rgba(4,5,7,.28) 52%,transparent 78%)}
.knopf .scheibe{position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(244,245,247,.82);background:rgba(8,10,13,.22);
  box-shadow:0 0 0 1px rgba(4,5,7,.28),0 10px 60px rgba(0,0,0,.5);
  backdrop-filter:blur(4px) brightness(.92);-webkit-backdrop-filter:blur(4px) brightness(.92)}
.knopf .puls{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(244,245,247,.5);
  animation:pulsen 3.4s var(--weich) infinite}
@keyframes pulsen{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.42);opacity:0}}
.knopf svg{position:relative;width:22%;height:22%;fill:var(--tinte);margin-left:8%}
.knopf .ladering{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);
  pointer-events:none;overflow:visible}
.knopf .ladering circle{fill:none;stroke:var(--akzent);stroke-width:1.5;
  stroke-dasharray:311;stroke-dashoffset:311;
  transition:stroke-dashoffset .6s var(--weich),opacity .6s var(--weich)}
.knopf.bereit .ladering circle{opacity:0}

/* ------------------------------------------------------- Kopf und Zeilen */
.kopf{position:absolute;top:0;right:0;z-index:8;display:flex;align-items:center;gap:7px;
      padding:clamp(10px,2vw,18px);opacity:1;transition:opacity .5s var(--weich)}
.rahmen.spielt .kopf{opacity:.42}
.rahmen.spielt .kopf:hover{opacity:1}
.wahl{display:flex;border:1px solid var(--haar-hell);border-radius:999px;overflow:hidden;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,12,15,.42)}
.wahl button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  padding:9px 11px;min-height:36px;color:var(--tinte-leise);transition:color .3s,background .3s}
.wahl button[aria-pressed="true"]{color:var(--grund);background:var(--tinte)}
.ton{width:38px;height:36px;display:grid;place-items:center;border:1px solid var(--haar-hell);
  border-radius:999px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(10,12,15,.42);transition:border-color .3s}
.ton:hover{border-color:var(--tinte)}
.ton svg{width:14px;height:14px;fill:none;stroke:var(--tinte);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.ton .kreuz{opacity:0}.ton[aria-pressed="true"] .kreuz{opacity:1}
.ton[aria-pressed="true"] .welle{opacity:0}

.zeile{position:absolute;left:6%;right:6%;bottom:clamp(48px,10%,88px);z-index:5;
       text-align:center;pointer-events:none}
.zeile p{font-family:var(--serif);font-size:clamp(15px,2.4vw,30px);line-height:1.34;
  letter-spacing:-.02em;max-width:26ch;margin:0 auto;
  text-shadow:0 2px 40px rgba(0,0,0,.95),0 1px 6px rgba(0,0,0,.85);
  opacity:0;transform:translateY(14px);
  transition:opacity .8s var(--weich),transform .9s var(--tief)}
.zeile p.da{opacity:1;transform:none}

.kapname{position:absolute;left:clamp(12px,3vw,26px);bottom:clamp(18px,4%,34px);z-index:5;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--tinte-leise);opacity:0;transition:opacity .7s var(--weich)}
.kapname.da{opacity:1}

.balken{position:absolute;left:clamp(12px,3vw,26px);right:clamp(12px,3vw,26px);
  bottom:clamp(9px,2%,17px);z-index:5;display:flex;gap:4px}
.balken i{flex:1;height:2px;background:rgba(244,245,247,.2);border-radius:2px;
  overflow:hidden;position:relative}
.balken i::after{content:"";position:absolute;inset:0;background:var(--tinte);
  transform-origin:left;transform:scaleX(var(--p,0))}

.laedt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;
  display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--tinte-leise);
  opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.laedt.da{opacity:1;visibility:visible}
.laedt i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(244,245,247,.2);
  border-top-color:var(--akzent);animation:kreisen .85s linear infinite}
@keyframes kreisen{to{transform:rotate(360deg)}}

.hinweis{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;
  max-width:30ch;text-align:center;font-size:13px;line-height:1.55;color:var(--tinte);
  background:rgba(10,12,15,.88);border:1px solid var(--haar-hell);border-radius:12px;
  padding:16px 20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.hinweis.da{opacity:1;visibility:visible}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<div class="rahmen" id="rahmen">
  <canvas class="rand" id="rand" aria-hidden="true"></canvas>
  <video id="kino" playsinline muted preload="metadata"></video>
  <img class="stand" id="stand" src="bild/poster.jpg" alt="">
  <div class="dunkel"></div>
  <button class="tippen" id="tippen" aria-label="Anhalten oder weiter"></button>

  <div class="kopf">
    <div class="wahl" id="wahl" role="group" aria-label="Sprache">
      <button id="bDe" aria-pressed="true">DE</button>
      <button id="bEn" aria-pressed="false">EN</button>
    </div>
    <button class="ton" id="bTon" aria-pressed="false" aria-label="Ton aus">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/>
        <g class="welle"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></g>
        <g class="kreuz"><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></g>
      </svg>
    </button>
  </div>

  <button class="knopf" id="start" aria-label="Rundgang starten">
    <span class="scheibe"></span>
    <span class="puls" aria-hidden="true"></span>
    <svg class="ladering" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49.5"/></svg>
    <svg viewBox="0 0 12 12" aria-hidden="true"><polygon points="2,1 11,6 2,11"/></svg>
  </button>

  <div class="zeile"><p id="zeile"></p></div>
  <div class="kapname" id="kapname"></div>
  <div class="balken" id="balken"></div>
  <div class="laedt" id="laedt"><i aria-hidden="true"></i><span data-de>Lädt</span><span data-en>Loading</span></div>
  <div class="hinweis" id="hinweis"></div>
</div>

<script src="zimmer.js?v=20260821175638"></script>
<script>
(function(){
"use strict";
var Z = window.ZIMMER || {}, KAPITEL = Z.kapitel || [], LAENGE = Z.laenge || 0;
var $ = function(i){ return document.getElementById(i); };
var rahmen=$("rahmen"), kino=$("kino"), stand=$("stand"), knopf=$("start"),
    zeileEl=$("zeile"), kapname=$("kapname"), balken=$("balken"),
    laedt=$("laedt"), hinweis=$("hinweis"), rand=$("rand");
var sprache="de", stumm=false, laeuft=false, gesagt=[], tonFrei=false, freigabeLaeuft=false;
var stimme=new Audio(); stimme.preload="auto";

kino.src = Z.video || "tour.mp4";
if(Z.englisch === false) $("wahl").style.display="none";
KAPITEL.forEach(function(){ balken.appendChild(document.createElement("i")); });
var balkenEl=[].slice.call(balken.children);

/* --- Ton freischalten: auf iPhone startet Ton nur im Fingertipp ---------- */
function tonFreischalten(){
  if(tonFrei || stumm) return;
  tonFrei = true; freigabeLaeuft = true;
  function fertig(){ freigabeLaeuft=false; stimme.volume=1; }
  try{
    stimme.src = "ton/" + sprache + "/1.m4a"; stimme.volume = 0;
    var v = stimme.play();
    if(v && v.then) v.then(function(){
      if(!freigabeLaeuft) return;
      stimme.pause(); stimme.currentTime = 0; fertig();
    }).catch(function(){ tonFrei=false; fertig(); });
    else { stimme.pause(); fertig(); }
  }catch(e){ tonFrei=false; fertig(); }
}

function sag(text){
  hinweis.textContent=text; hinweis.classList.add("da");
  setTimeout(function(){ hinweis.classList.remove("da"); }, 4000);
}
function sprich(i){
  if(stumm) return;
  freigabeLaeuft=false; stimme.volume=1;
  try{ stimme.pause(); }catch(e){}
  stimme.src = "ton/" + sprache + "/" + (i+1) + ".m4a";
  stimme.play().catch(function(){});
}
function zeigeZeile(i){
  zeileEl.classList.remove("da");
  setTimeout(function(){
    zeileEl.textContent = KAPITEL[i].lisa[sprache];
    kapname.textContent = KAPITEL[i].titel[sprache];
    zeileEl.classList.add("da"); kapname.classList.add("da");
  }, 240);
}

/* --- Randfuellung: winziger Auszug des laufenden Bildes ------------------ */
var ctx=null, timer=null;
rand.width=32; rand.height=18;
function maleRand(){
  if(!ctx) ctx = rand.getContext("2d");
  if(kino.readyState>=2){ try{ ctx.drawImage(kino,0,0,32,18); rand.classList.add("da"); }catch(e){} }
}

/* --- Ladestand am Knopfrand --------------------------------------------- */
function ladestand(){
  try{
    if(!kino.buffered || !kino.buffered.length || !kino.duration) return 0;
    return Math.min(kino.buffered.end(kino.buffered.length-1)/kino.duration, 1);
  }catch(e){ return 0; }
}
setInterval(function(){
  var p = ladestand(), ring = knopf.querySelector(".ladering circle");
  if(ring) ring.style.strokeDashoffset = (311*(1-p)).toFixed(1);
  knopf.classList.toggle("bereit", p >= 0.35);
  if(laeuft) laedt.classList.toggle("da", kino.readyState < 3);
}, 400);

kino.addEventListener("waiting", function(){ laedt.classList.add("da"); });
kino.addEventListener("playing", function(){ laedt.classList.remove("da"); });
kino.addEventListener("error", function(){
  laedt.classList.remove("da");
  sag(sprache==="de" ? "Der Rundgang lässt sich gerade nicht laden."
                     : "The tour cannot be loaded right now.");
});

kino.addEventListener("timeupdate", function(){
  var t = kino.currentTime, i = -1;
  for(var n=0;n<KAPITEL.length;n++) if(t >= KAPITEL[n].bei) i = n;
  if(i>=0 && !gesagt[i]){ gesagt[i]=true; sprich(i); zeigeZeile(i); }
  for(var j=0;j<KAPITEL.length;j++){
    var a=KAPITEL[j].bei, b=(j+1<KAPITEL.length)?KAPITEL[j+1].bei:LAENGE;
    var p = t<=a ? 0 : (t>=b ? 1 : (t-a)/(b-a));
    balkenEl[j].style.setProperty("--p", p.toFixed(3));
  }
});
kino.addEventListener("seeked", function(){
  for(var i=0;i<KAPITEL.length;i++) if(KAPITEL[i].bei > kino.currentTime) gesagt[i]=false;
});
kino.addEventListener("pause", function(){ try{ stimme.pause(); }catch(e){} });
kino.addEventListener("ended", function(){
  laeuft=false; rahmen.classList.remove("spielt");
  zeileEl.classList.remove("da"); kapname.classList.remove("da");
  clearInterval(timer); timer=null; rand.classList.remove("da");
  stand.classList.remove("weg");
  knopf.classList.remove("weg");
  knopf.setAttribute("aria-label", sprache==="de" ? "Noch einmal ansehen" : "Watch again");
});

function los(){
  tonFreischalten();
  gesagt=[]; laeuft=true;
  rahmen.classList.add("spielt");
  stand.classList.add("weg");
  knopf.classList.add("weg");
  balkenEl.forEach(function(b){ b.style.setProperty("--p",0); });
  clearInterval(timer); maleRand(); timer=setInterval(maleRand,200);
  try{ kino.currentTime=0; }catch(e){}
  laedt.classList.toggle("da", kino.readyState<3);
  function ab(){
    laedt.classList.remove("da");
    kino.play().catch(function(){
      sag(sprache==="de" ? "Die Wiedergabe wurde blockiert. Bitte noch einmal tippen."
                         : "Playback was blocked. Please tap again.");
    });
  }
  if(kino.readyState>=3) ab(); else kino.addEventListener("canplay", ab, {once:true});
}
knopf.addEventListener("click", los);

$("tippen").addEventListener("click", function(){
  if(!laeuft) return los();
  if(kino.paused){ kino.play(); if(!stumm && stimme.src) stimme.play().catch(function(){}); }
  else { kino.pause(); }
});

/* --- Sprache und Ton ----------------------------------------------------- */
function setzeSprache(neu){
  sprache = neu; document.documentElement.lang = neu;
  $("bDe").setAttribute("aria-pressed", neu==="de");
  $("bEn").setAttribute("aria-pressed", neu==="en");
  if(laeuft){
    var t=kino.currentTime, i=-1;
    for(var n=0;n<KAPITEL.length;n++) if(t>=KAPITEL[n].bei) i=n;
    if(i>=0){ zeigeZeile(i); if(!stumm) sprich(i); }
  }
}
$("bDe").addEventListener("click", function(){ setzeSprache("de"); });
$("bEn").addEventListener("click", function(){ setzeSprache("en"); });
$("bTon").addEventListener("click", function(){
  stumm = !stumm;
  this.setAttribute("aria-pressed", stumm);
  this.setAttribute("aria-label", stumm
    ? (sprache==="de"?"Ton an":"Sound on") : (sprache==="de"?"Ton aus":"Sound off"));
  if(stumm){ try{ stimme.pause(); stimme.currentTime=0; }catch(e){} }
  else if(laeuft){
    tonFreischalten();
    var t=kino.currentTime, i=-1;
    for(var n=0;n<KAPITEL.length;n++) if(t>=KAPITEL[n].bei) i=n;
    if(i>=0) sprich(i);
  }
});

/* Sprache aus der Adresse: ?s=en. So kann ein Hotel die englische Fassung
   direkt einbinden, ohne dass der Gast umschalten muss. */
(function(){
  var a = (location.search.match(/[?&]s=(de|en)/)||[])[1];
  var b = (navigator.language||"de").slice(0,2)==="en" ? "en" : "de";
  if((a||b) === "en") setzeSprache("en");
})();
})();
</script>
</html>
