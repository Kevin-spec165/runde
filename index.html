<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Die Runde">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Die Runde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root{
    --grund:#e9eef3; --flaeche:#fff; --flaeche2:#f3f6f9;
    --tinte:#0f1a24; --leise:#5d6f80; --linie:rgba(15,26,36,.13);
    --akzent:#c25f0c; --akzent-t:#fff;
    --ja:#136b47; --nein:#8f3128; --warte:#1f5d86; --merk:#a8760a;
    --schatten:0 1px 2px rgba(15,26,36,.07),0 4px 14px rgba(15,26,36,.06);
    --d:"Barlow Condensed","Barlow",system-ui,sans-serif;
    --b:"Barlow",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --grund:#0c141c; --flaeche:#15202b; --flaeche2:#1b2733;
      --tinte:#e7eef5; --leise:#8ba0b3; --linie:rgba(231,238,245,.14);
      --akzent:#ef8f2e; --akzent-t:#1a1206;
      --ja:#3bb283; --nein:#dd7266; --warte:#5aa8dd; --merk:#e0b44a;
      --schatten:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --grund:#0c141c; --flaeche:#15202b; --flaeche2:#1b2733;
    --tinte:#e7eef5; --leise:#8ba0b3; --linie:rgba(231,238,245,.14);
    --akzent:#ef8f2e; --akzent-t:#1a1206;
    --ja:#3bb283; --nein:#dd7266; --warte:#5aa8dd; --merk:#e0b44a;
    --schatten:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--grund);color:var(--tinte);font-family:var(--b);
       font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .huelle{max-width:620px;margin:0 auto;padding:0 12px 130px}

  .kopf{position:sticky;top:0;z-index:30;background:var(--grund);padding:12px 0 9px;
        border-bottom:1px solid var(--linie)}
  .titel{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
  .titel h1{font-family:var(--d);font-size:25px;font-weight:700;margin:0;text-transform:uppercase}
  .titel span{font-size:12px;color:var(--leise);font-variant-numeric:tabular-nums}
  .tally{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .z{background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;
     padding:6px 2px;text-align:center;cursor:pointer;font-family:var(--b);
     transition:border-color .12s ease,background .12s ease}
  .z:active{transform:scale(.97)}
  .z.an{border-color:var(--tinte);border-width:2px;padding:5px 1px;background:var(--flaeche2)}
  .z.an.a{border-color:var(--akzent)} .z.an.w{border-color:var(--warte)}
  .z.an.j{border-color:var(--ja)} .z.an.n{border-color:var(--nein)}
  .z b{display:block;font-family:var(--d);font-size:20px;font-weight:700;line-height:1;
       font-variant-numeric:tabular-nums}
  .z i{display:block;font-style:normal;font-size:9px;letter-spacing:.03em;
       text-transform:uppercase;color:var(--leise);margin-top:3px}
  .z.a b{color:var(--akzent)} .z.w b{color:var(--warte)}
  .z.j b{color:var(--ja)} .z.n b{color:var(--nein)}

  .leiste{display:flex;align-items:center;gap:7px;margin-top:8px}
  .ich{display:flex;align-items:center;gap:6px;background:var(--flaeche);border:1px solid var(--linie);
       border-radius:99px;padding:6px 11px;font:600 13px var(--b);color:var(--tinte);cursor:pointer;flex:none}
  .ich .kugel{width:19px;height:19px;border-radius:99px;background:var(--akzent);color:var(--akzent-t);
              display:grid;place-items:center;font:700 11px var(--b);flex:none}
  .suche{flex:1;min-width:0;background:var(--flaeche);border:1px solid var(--linie);border-radius:99px;
         padding:8px 13px;font:400 14px var(--b);color:var(--tinte)}
  .suche::placeholder{color:var(--leise)}
  .suche:focus{outline:2px solid var(--akzent);outline-offset:1px}
  .filter{display:flex;background:var(--flaeche);border:1px solid var(--linie);border-radius:99px;
          padding:2px;margin-top:7px}
  .filter button{flex:1;border:0;background:transparent;border-radius:99px;padding:7px 4px;
                 font:600 12px var(--b);color:var(--leise);cursor:pointer;white-space:nowrap}
  .filter button.an{background:var(--tinte);color:var(--flaeche)}
  .filter button .n{font-variant-numeric:tabular-nums;opacity:.75}
  .erklaerung{margin:8px 2px 0;font-size:12.5px;color:var(--leise);line-height:1.35}
  .erklaerung b{color:var(--tinte);font-weight:600}

  .jetzt{position:relative;background:var(--flaeche);border-radius:14px;box-shadow:var(--schatten);
         margin-top:13px;padding:16px;border:1px solid var(--linie)}
  .jetzt.warten{border-left:4px solid var(--warte)}
  .jetzt.arbeit{border-left:4px solid var(--akzent)}
  .jetzt.zugesagt{border-left:4px solid var(--ja)}
  .jetzt .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
                  color:var(--akzent);font-weight:600;margin-bottom:6px}
  .jetzt h2{font-family:var(--d);font-size:30px;line-height:1.05;font-weight:700;
            margin:0 44px 6px 0;text-wrap:balance}
  .stern{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:99px;
         border:1px solid var(--linie);background:var(--flaeche2);cursor:pointer;
         display:grid;place-items:center;padding:0}
  .stern svg{width:19px;height:19px;fill:none;stroke:var(--leise);stroke-width:1.8}
  .stern.an{background:color-mix(in srgb,var(--merk) 16%,transparent);border-color:var(--merk)}
  .stern.an svg{fill:var(--merk);stroke:var(--merk)}
  .adr{color:var(--leise);font-size:15px;margin-bottom:11px}
  .marken{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
  .marke{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
         padding:4px 9px;border-radius:99px;border:1px solid var(--linie);color:var(--leise)}
  .marke.chef{border-color:color-mix(in srgb,var(--ja) 45%,transparent);color:var(--ja)}
  .marke.ruf{border-color:color-mix(in srgb,var(--akzent) 50%,transparent);color:var(--akzent)}
  .marke.w{border-color:var(--warte);color:var(--warte);
           background:color-mix(in srgb,var(--warte) 12%,transparent)}
  .marke.faellig{background:var(--warte);color:#fff;border-color:var(--warte)}

  .los{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
       background:var(--akzent);color:var(--akzent-t);border:0;border-radius:12px;padding:17px;
       font:700 17px var(--b);cursor:pointer;text-decoration:none;transition:transform .12s ease}
  .los:active{transform:scale(.985)}
  .los svg{width:19px;height:19px;fill:currentColor;flex:none}
  .zweit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .knopf{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--flaeche2);
         color:var(--tinte);border:1px solid var(--linie);border-radius:11px;padding:13px;
         font:600 14px var(--b);cursor:pointer;text-decoration:none}
  .knopf:active{background:var(--grund)}
  .knopf.aus{opacity:.42;pointer-events:none}

  .abfrage{margin-top:13px;padding-top:12px;border-top:1px solid var(--linie)}
  .abfrage>p{margin:0 0 8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--leise);font-weight:600}
  .stand{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .sb{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--linie);
      background:transparent;border-radius:11px;padding:11px 12px;text-align:left;
      font:600 14px var(--b);color:var(--tinte);cursor:pointer;transition:all .12s ease}
  .sb small{font-weight:400;font-size:11.5px;color:var(--leise);line-height:1.25}
  .sb:active{transform:scale(.98)}
  .sb.a{color:var(--akzent);border-color:color-mix(in srgb,var(--akzent) 42%,transparent)}
  .sb.w{color:var(--warte);border-color:color-mix(in srgb,var(--warte) 42%,transparent)}
  .sb.j{color:var(--ja);border-color:color-mix(in srgb,var(--ja) 42%,transparent)}
  .sb.n{color:var(--nein);border-color:color-mix(in srgb,var(--nein) 42%,transparent)}
  .sb.an{color:#fff}
  .sb.an small{color:rgba(255,255,255,.8)}
  .sb.a.an{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-t)}
  .sb.a.an small{color:color-mix(in srgb,var(--akzent-t) 75%,transparent)}
  .sb.w.an{background:var(--warte);border-color:var(--warte)}
  .sb.j.an{background:var(--ja);border-color:var(--ja)}
  .sb.n.an{background:var(--nein);border-color:var(--nein)}

  .wann{margin-top:9px;padding:11px;background:color-mix(in srgb,var(--warte) 9%,var(--flaeche2));
        border:1px solid color-mix(in srgb,var(--warte) 30%,transparent);border-radius:11px}
  .wann p{margin:0 0 8px;font-size:12px;color:var(--warte);font-weight:600}
  .wannreihe{display:flex;flex-wrap:wrap;gap:6px}
  .wannreihe button{border:1px solid color-mix(in srgb,var(--warte) 35%,transparent);background:var(--flaeche);
                    color:var(--warte);border-radius:99px;padding:8px 13px;font:600 13px var(--b);cursor:pointer}
  .wannreihe button.an{background:var(--warte);color:#fff}
  .genau{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;
         padding-top:10px;border-top:1px solid color-mix(in srgb,var(--warte) 25%,transparent)}
  .genau label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
               color:var(--warte);font-weight:600;margin-bottom:4px}
  .genau input{width:100%;border:1px solid color-mix(in srgb,var(--warte) 35%,transparent);
               background:var(--flaeche);color:var(--tinte);border-radius:10px;padding:11px 12px;
               font:600 15px var(--b);font-variant-numeric:tabular-nums}
  .genau input:focus{outline:2px solid var(--warte);outline-offset:1px}
  .zeitwahl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .zeitwahl button{border:1px solid color-mix(in srgb,var(--warte) 30%,transparent);
                   background:var(--flaeche);color:var(--warte);border-radius:99px;
                   padding:6px 11px;font:600 12.5px var(--b);cursor:pointer}
  .zeitwahl button.an{background:var(--warte);color:#fff}
  .zeitwahl button.belegt{border-color:color-mix(in srgb,var(--nein) 40%,transparent);
                          color:var(--nein);opacity:.55;text-decoration:line-through}

  .konflikt{margin-top:10px;padding:12px;border-radius:11px;
            background:color-mix(in srgb,var(--nein) 12%,var(--flaeche));
            border:1.5px solid var(--nein);animation:pochen 1.1s ease-in-out 2}
  .konflikt p{margin:0 0 4px;font:700 13.5px var(--b);color:var(--nein)}
  .konflikt span{display:block;font-size:12.5px;color:var(--tinte);line-height:1.4}
  .konflikt button{margin-top:9px;width:100%;border:0;background:var(--nein);color:#fff;
                   border-radius:10px;padding:11px;font:700 14px var(--b);cursor:pointer}
  @keyframes pochen{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--nein) 40%,transparent)}
                    50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--nein) 0%,transparent)}}
  .jetzt.stoerung{border-left-color:var(--nein)}
  .marke.stoerung{background:var(--nein);color:#fff;border-color:var(--nein)}
  .reihe.stoerung{border-left-color:var(--nein)}
  .wv.stoerung{background:var(--nein);color:#fff}
  .wannreihe input{display:none}

  .notiz{width:100%;margin-top:9px;background:var(--flaeche2);border:1px solid var(--linie);
         border-radius:11px;padding:11px;font:400 15px var(--b);color:var(--tinte);resize:none}
  .notiz::placeholder{color:var(--leise)}
  .notiz:focus{outline:2px solid var(--akzent);outline-offset:1px}

  .routebox{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;
            background:color-mix(in srgb,var(--akzent) 10%,var(--flaeche));
            border:1px solid color-mix(in srgb,var(--akzent) 34%,transparent);border-radius:12px}
  .routebox b{font-family:var(--d);font-size:26px;font-weight:700;line-height:1;color:var(--akzent);
              font-variant-numeric:tabular-nums;flex:none}
  .routebox span{font-size:13px;line-height:1.35}
  .routebox .zu{margin-left:auto;border:0;background:transparent;color:var(--leise);
                font:600 20px var(--b);cursor:pointer;padding:0 4px;flex:none}

  .abschnitt{display:flex;align-items:center;gap:9px;margin:20px 2px 8px}
  .abschnitt h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--leise);
                margin:0;font-weight:600}
  .abschnitt.faellig h3{color:var(--warte)}
  .abschnitt hr{flex:1;border:0;border-top:1px solid var(--linie);margin:0}

  .reihe{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--flaeche);
         border:1px solid var(--linie);border-radius:11px;padding:10px 12px;margin-bottom:6px;
         cursor:pointer;font-family:var(--b);color:var(--tinte);border-left-width:3px}
  .reihe:active{border-color:var(--akzent)}
  .reihe.s-arbeit{border-left-color:var(--akzent)}
  .reihe.s-warten{border-left-color:var(--warte)}
  .reihe.s-zugesagt{border-left-color:var(--ja)}
  .reihe.s-abgelehnt{border-left-color:var(--nein)}
  .reihe .nr{font-family:var(--d);font-size:16px;font-weight:600;color:var(--leise);
             min-width:22px;font-variant-numeric:tabular-nums;flex:none}
  .reihe .txt{flex:1;min-width:0}
  .reihe .nm{display:block;font-family:var(--d);font-size:18px;font-weight:600;line-height:1.15;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reihe .st{display:block;font-size:12.5px;color:var(--leise);line-height:1.3;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reihe .rechts{display:flex;align-items:center;gap:6px;flex:none}
  .reihe .km{font-size:12px;color:var(--leise);font-variant-numeric:tabular-nums}
  .reihe .stern2{width:14px;height:14px;fill:var(--merk);flex:none}
  .reihe.fertig{opacity:.52}
  .reihe.fertig .nm{text-decoration:line-through;text-decoration-thickness:1px}
  .wv{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;flex:none;
      background:color-mix(in srgb,var(--warte) 15%,transparent);color:var(--warte)}
  .wv.jetzt2{background:var(--warte);color:#fff}
  .wer{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;flex:none;
       background:color-mix(in srgb,var(--akzent) 16%,transparent);color:var(--akzent)}

  .fuss{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--flaeche);
        border-top:1px solid var(--linie);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
        display:flex;gap:8px}
  .fuss button{flex:1;background:var(--flaeche2);border:1px solid var(--linie);border-radius:11px;
               padding:12px 6px;font:600 14px var(--b);color:var(--tinte);cursor:pointer}
  .fuss button:active{background:var(--grund)}
  .leer{text-align:center;padding:40px 16px;color:var(--leise)}
  .leer b{display:block;font-family:var(--d);font-size:25px;color:var(--tinte);margin-bottom:6px}
  .quelle{margin:26px 2px 0;padding-top:14px;border-top:1px solid var(--linie);
          font-size:11.5px;line-height:1.5;color:var(--leise)}
  .quelle a{color:var(--leise)}
  .hinweis{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(12px);
           background:var(--tinte);color:var(--grund);padding:11px 17px;border-radius:99px;
           font:600 14px var(--b);opacity:0;pointer-events:none;transition:all .22s ease;z-index:50;
           max-width:90vw;text-align:center}
  .hinweis.an{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <button type="button" data-f="gemerkt">Gemerkt <span class="n" id="nGemerkt"></span></button>
      <button type="button" data-f="meine">Meine</button>
    </div>
    <p class="erklaerung" id="erklaerung"></p>
  </header>
  <main id="buehne"></main>
  <button id="btnExport" type="button" class="knopf" style="margin-top:22px">Stand kopieren und weitergeben</button>
  <p class="quelle">
    Hoteldaten aus <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>,
    abgefragt am 20. August 2026, Lizenz ODbL. Ketten und Häuser ab vier Sternen sind bewusst
    nicht enthalten. Angaben können veralten — im Zweifel vorher anrufen.
  </p>
</div>

<nav class="fuss">
  <button id="btnGps" type="button">Ab meinem Standort</button>
  <button id="btnHier" type="button">Ab diesem Haus</button>
</nav>
<div class="hinweis" id="hinweis"></div>

<script>
(function(){
  "use strict";
  var SP = "runde.dresden.v2", SP_ICH = "runde.dresden.ich";
  var stand = {};
  try { stand = JSON.parse(localStorage.getItem(SP) || "null") || altUebernehmen(); }
  catch(e){ stand = {}; }
  var ich = localStorage.getItem(SP_ICH) || "Kevin";
  var filter = "alle", suchwort = "";
  var reihenfolge = HOTELS.map(function(h){ return h.id; });
  var aktuell = null, strecken = {}, routeInfo = null;

  // Wer die alte Fassung benutzt hat, verliert seinen Stand nicht.
  function altUebernehmen(){
    try {
      var alt = JSON.parse(localStorage.getItem("runde.dresden.v1") || "{}");
      var neu = {};
      for (var k in alt){
        var a = alt[k];
        neu[k] = {s: a.s === "besucht" ? "arbeit" : (a.s || "offen"), n: a.n || "", w: a.w || ""};
      }
      // Sofort im neuen Format sichern, sonst haengt die Uebernahme
      // bei jedem Start neu am alten Schluessel.
      if (Object.keys(neu).length) localStorage.setItem(SP, JSON.stringify(neu));
      return neu;
    } catch(e){ return {}; }
  }

  var ZUSTAENDE = {
    offen:     {kurz:"offen",           wo:"offen"},
    arbeit:    {kurz:"läuft",           wo:"läuft"},
    warten:    {kurz:"Wiedervorlage",   wo:"Wiedervorl."},
    zugesagt:  {kurz:"Zimmer zugesagt", wo:"zugesagt"},
    abgelehnt: {kurz:"abgelehnt",       wo:"Nein"}
  };

  function sichern(){ try{ localStorage.setItem(SP, JSON.stringify(stand)); }catch(e){} }
  function e(id){ return stand[id] || {}; }
  function zustand(id){ return e(id).s || "offen"; }
  function notizVon(id){ return e(id).n || ""; }
  function werVon(id){ return e(id).w || ""; }
  function wvVon(id){ return e(id).wv || ""; }
  function wzVon(id){ return e(id).wz || ""; }
  function gemerkt(id){ return !!e(id).m; }
  function fertig(id){ var z = zustand(id); return z === "zugesagt" || z === "abgelehnt"; }
  function heute(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function faellig(id){ var w = wvVon(id); return w && w <= heute(); }

  function setzen(id, s){
    if(!stand[id]) stand[id] = {};
    stand[id].s = s;
    if (s !== "offen") stand[id].w = ich; else { delete stand[id].w; delete stand[id].wv; delete stand[id].wz; }
    if (s !== "warten") { delete stand[id].wv; delete stand[id].wz; }
    sichern();
  }
  function merken(id){
    if(!stand[id]) stand[id] = {};
    stand[id].m = !stand[id].m; sichern();
    return stand[id].m;
  }
  function wvSetzen(id, datum){
    if(!stand[id]) stand[id] = {};
    var zeit = stand[id].wz || "";
    if (zeit){
      var k = stoerung(id, datum, zeit);
      if (k){
        letzteStoerung = {id: id, zeit: zeit, datum: datum, mit: k,
                          frei: naechsterFrei(id, datum, zeit)};
        return false;
      }
    }
    letzteStoerung = null;
    stand[id].wv = datum; stand[id].s = "warten"; stand[id].w = ich; sichern();
    return true;
  }
  var letzteStoerung = null;   // fuer die Anzeige im Block
  function wzSetzen(id, zeit){
    if(!stand[id]) stand[id] = {};
    var datum = stand[id].wv || inTagen(1);
    if (zeit){
      var k = stoerung(id, datum, zeit);
      if (k){
        // Termin wird nicht gesetzt. Stattdessen roter Hinweis mit Vorschlag.
        letzteStoerung = {id: id, zeit: zeit, mit: k, frei: naechsterFrei(id, datum, zeit)};
        return false;
      }
      stand[id].wz = zeit;
    } else delete stand[id].wz;
    letzteStoerung = null;
    if (!stand[id].wv) { stand[id].wv = datum; stand[id].s = "warten"; stand[id].w = ich; }
    sichern();
    return true;
  }
  var ABSTAND = 30;   // Minuten, die zwischen zwei Terminen liegen muessen

  function inMinuten(hhmm){
    var p = (hhmm || "").split(":");
    return p.length === 2 ? parseInt(p[0],10)*60 + parseInt(p[1],10) : null;
  }
  function alsUhrzeit(min){
    min = ((min % 1440) + 1440) % 1440;
    return String(Math.floor(min/60)).padStart(2,"0") + ":" + String(min%60).padStart(2,"0");
  }
  // Kollidiert ein Termin mit einem anderen? Nur wenn beide eine Uhrzeit haben.
  function stoerung(id, datum, zeit){
    var m = inMinuten(zeit);
    if (!datum || m === null) return null;
    for (var i=0;i<HOTELS.length;i++){
      var o = HOTELS[i];
      if (o.id === id) continue;
      if (wvVon(o.id) !== datum) continue;
      var m2 = inMinuten(wzVon(o.id));
      if (m2 === null) continue;
      if (Math.abs(m2 - m) < ABSTAND) return {haus: o, zeit: wzVon(o.id), abstand: Math.abs(m2-m)};
    }
    return null;
  }
  // Naechster freier Platz ab der gewuenschten Zeit, in Viertelstunden
  function naechsterFrei(id, datum, zeit){
    var start = inMinuten(zeit);
    if (start === null) return null;
    for (var schritt=1; schritt<=48; schritt++){
      var kandidat = start + schritt*15;
      if (kandidat > 21*60) break;
      if (!stoerung(id, datum, alsUhrzeit(kandidat))) return alsUhrzeit(kandidat);
    }
    return null;
  }
  // Steht dieses Haus gerade in einem Konflikt?
  function hatStoerung(id){
    return !!stoerung(id, wvVon(id), wzVon(id));
  }

  // Tag und Uhrzeit zusammen, so wie man es sagen wuerde
  function wannText(id){
    var d = datumText(wvVon(id)), z = wzVon(id);
    return z ? d + " um " + z + " Uhr" : d;
  }
  function inTagen(n){
    var d = new Date(); d.setDate(d.getDate()+n);
    return d.toISOString().slice(0,10);
  }
  function datumText(iso){
    if (!iso) return "";
    var d = new Date(iso + "T12:00:00"), h = new Date(heute() + "T12:00:00");
    var tage = Math.round((d-h)/86400000);
    if (tage < 0) return "überfällig";
    if (tage === 0) return "heute";
    if (tage === 1) return "morgen";
    if (tage < 7) return "in " + tage + " Tagen";
    return d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"});
  }

  function sagen(t){
    var h = document.getElementById("hinweis");
    h.textContent = t; h.classList.add("an");
    clearTimeout(h._t); h._t = setTimeout(function(){ h.classList.remove("an"); }, 2200);
  }
  function meter(a,b){
    var R=6371000, t=Math.PI/180, p1=a.la*t, p2=b.la*t, dp=p2-p1, dl=(b.lo-a.lo)*t;
    var x=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
    return 2*R*Math.asin(Math.sqrt(x));
  }
  function weg(m){ return m>=1000 ? (m/1000).toFixed(1).replace(".",",")+" km" : Math.round(m)+" m"; }
  function nachId(id){ for(var i=0;i<HOTELS.length;i++) if(HOTELS[i].id===id) return HOTELS[i]; return null; }
  function karteLink(h){ return "https://www.google.com/maps/dir/?api=1&destination="+h.la+","+h.lo+"&travelmode=walking"; }

  function elbseite(la, lo){
    var bd=Infinity, best=null;
    for (var i=0;i<ELBE.length-1;i++){
      var ay=ELBE[i][0], ax=ELBE[i][1], by=ELBE[i+1][0], bx=ELBE[i+1][1];
      var dx=bx-ax, dy=by-ay;
      var t=(dx===0&&dy===0)?0:Math.max(0,Math.min(1,((lo-ax)*dx+(la-ay)*dy)/(dx*dx+dy*dy)));
      var cx=ax+t*dx, cy=ay+t*dy, d=(lo-cx)*(lo-cx)+(la-cy)*(la-cy);
      if(d<bd){ bd=d; best=[ax,ay,bx,by]; }
    }
    return ((best[2]-best[0])*(la-best[1]) - (best[3]-best[1])*(lo-best[0])) > 0 ? 1 : 0;
  }
  var BRUECKE = 1500;
  function wegKosten(a,b){
    var sa = a.k!==undefined ? a.k : elbseite(a.la,a.lo);
    var sb = b.k!==undefined ? b.k : elbseite(b.la,b.lo);
    return meter(a,b) + (sa===sb ? 0 : BRUECKE);
  }
  function routeRechnen(haeuser, von){
    var rest=haeuser.slice(), pfad=[], akt=von;
    while(rest.length){
      var b=0;
      for(var i=1;i<rest.length;i++) if(wegKosten(akt,rest[i])<wegKosten(akt,rest[b])) b=i;
      akt=rest[b]; pfad.push(rest[b]); rest.splice(b,1);
    }
    var runden=0, besser=true;
    while(besser && runden<80){
      besser=false; runden++;
      for(var i=0;i<pfad.length-1;i++) for(var k=i+1;k<pfad.length;k++){
        var vor=i===0?von:pfad[i-1], erst=pfad[i], letzt=pfad[k];
        var nach=(k+1<pfad.length)?pfad[k+1]:null;
        var alt=wegKosten(vor,erst)+(nach?wegKosten(letzt,nach):0);
        var neu=wegKosten(vor,letzt)+(nach?wegKosten(erst,nach):0);
        if(neu<alt-0.5){
          var teil=pfad.slice(i,k+1).reverse();
          Array.prototype.splice.apply(pfad,[i,k-i+1].concat(teil));
          besser=true;
        }
      }
    }
    return pfad;
  }
  function streckenSetzen(pfad, von){
    strecken={}; var vor=von, g=0;
    for(var i=0;i<pfad.length;i++){ var d=meter(vor,pfad[i]); strecken[pfad[i].id]=d; g+=d; vor=pfad[i]; }
    return g;
  }
  function tagesreichweite(pfad, von){
    var min=0, vor=von, n=0, m=0;
    for(var i=0;i<pfad.length;i++){
      var d=meter(vor,pfad[i]);
      min += (d>1500 ? 8+d/1000/20*60 : d/75) + 15;
      if(min>360) break;
      m+=d; n++; vor=pfad[i];
    }
    return {haeuser:n, meter:m};
  }

  // Was jeder Filter zeigt, in einem Satz. Steht unter der Filterzeile.
  var ERKLAERT = {
    alle:      ["Alle Häuser", "in Laufreihenfolge. Oben steht, wo du als Nächstes hingehst."],
    offen:     ["Noch nicht angesprochen", "— hier warst du noch gar nicht."],
    arbeit:    ["Läuft", "— du warst da, es ist noch nichts entschieden. Kein Datum gesetzt."],
    warten:    ["Wiedervorlage", "— alle mit gesetztem Tag, auch die weiter in der Zukunft."],
    zugesagt:  ["Zimmer zugesagt", "— du darfst filmen. Das ist deine Ausbeute."],
    abgelehnt: ["Kein Interesse", "— abgehakt, kommt nicht wieder."],
    faellig:   ["Heute dran", "— von den Wiedervorlagen oben die, deren Tag jetzt gekommen ist. Hier gehst du als Erstes hin."],
    gemerkt:   ["Gemerkt", "— mit dem Stern für später markiert, unabhängig vom Stand."],
    meine:     ["Von dir bearbeitet", "— trägt deinen Namen. Zählt erst, wenn ihr zu zweit lauft."]
  };
  var LEER = {
    offen:     "Alle Häuser sind angefasst. Ordentlich.",
    arbeit:    "Kein Gespräch offen. Tippst du bei einem Haus auf „In Bearbeitung“, taucht es hier auf.",
    warten:    "Keine Wiedervorlage gesetzt. Ist der Chef nicht da, tippe auf „Wiedervorlage“ und wähl einen Tag.",
    zugesagt:  "Noch kein Zimmer zugesagt. Das ändert sich beim ersten Ja.",
    abgelehnt: "Noch keine Absage. Kommt schon.",
    faellig:   "Heute steht nichts an. Hier landen Häuser von selbst, sobald der Tag ihrer Wiedervorlage gekommen ist — nicht durch „In Bearbeitung“.",
    gemerkt:   "Nichts gemerkt. Tippe oben rechts auf den Stern, um ein Haus für später vorzumerken.",
    meine:     "Nichts von dir bearbeitet. Sobald du irgendwo einen Stand setzt, steht dein Name dran.",
    alle:      "Alles durch. Sag Bescheid, dann hole ich neue Häuser."
  };
  var ZUSTANDSFILTER = ["offen","arbeit","warten","zugesagt","abgelehnt"];

  function passtFilter(h){
    if (suchwort){
      var t = (h.n + " " + h.s).toLowerCase();
      if (t.indexOf(suchwort) < 0) return false;
    }
    if (filter === "alle")     return !fertig(h.id);
    if (filter === "faellig")  return faellig(h.id);
    if (filter === "gemerkt")  return gemerkt(h.id);
    if (filter === "meine")    return werVon(h.id) === ich;
    return zustand(h.id) === filter;
  }
  function liste_offen(){
    var o = [];
    for (var i=0;i<reihenfolge.length;i++){
      var h = nachId(reihenfolge[i]);
      if (h && passtFilter(h)) o.push(h);
    }
    return o;
  }
  function erklaerungSetzen(){
    var e = ERKLAERT[filter] || ERKLAERT.alle;
    document.getElementById("erklaerung").innerHTML = "<b>" + e[0] + "</b> " + e[1];
    document.querySelectorAll("#tally .z, #filter button").forEach(function(b){
      b.classList.toggle("an", b.dataset.f === filter);
    });
  }

  function zaehlen(){
    var c = {offen:0, arbeit:0, warten:0, zugesagt:0, abgelehnt:0};
    for (var i=0;i<HOTELS.length;i++) c[zustand(HOTELS[i].id)]++;
    document.getElementById("z1").textContent = c.offen;
    document.getElementById("z2").textContent = c.arbeit;
    document.getElementById("z3").textContent = c.warten;
    document.getElementById("z4").textContent = c.zugesagt;
    document.getElementById("z5").textContent = c.abgelehnt;
    var kollisionen = HOTELS.filter(function(h){ return hatStoerung(h.id); }).length;
    var f = document.getElementById("fortschritt");
    f.textContent = kollisionen
      ? kollisionen + " Termin" + (kollisionen>1?"e":"") + " doppelt belegt"
      : (c.zugesagt + c.abgelehnt) + " von " + HOTELS.length + " durch";
    f.style.color = kollisionen ? "var(--nein)" : "";
    f.style.fontWeight = kollisionen ? "700" : "";
    var nf = HOTELS.filter(function(h){ return faellig(h.id); }).length;
    var ng = HOTELS.filter(function(h){ return gemerkt(h.id); }).length;
    document.getElementById("nFaellig").textContent = nf ? nf : "";
    document.getElementById("nGemerkt").textContent = ng ? ng : "";
  }

  var STERN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg>';

  function bauen(){
    zaehlen();
    erklaerungSetzen();
    var b = document.getElementById("buehne");
    b.textContent = "";
    var offen = liste_offen();

    if (!offen.length){
      var l = document.createElement("div");
      l.className = "leer";
      var kopf = (ERKLAERT[filter] || ERKLAERT.alle)[0];
      l.innerHTML = suchwort
        ? "<b>Nichts gefunden</b>Kein Haus passt zu „" + suchwort + "“. Suche leeren."
        : "<b>" + kopf + ": nichts drin</b>" + (LEER[filter] || "");
      b.appendChild(l);
    } else {
      if (!aktuell || !offen.some(function(x){ return x.id === aktuell; })) aktuell = offen[0].id;
      var h = nachId(aktuell), idx = offen.indexOf(h), z = zustand(h.id);

      var k = document.createElement("section");
      k.className = "jetzt" + (z !== "offen" ? " " + z : "") + (hatStoerung(h.id) ? " stoerung" : "");
      var marken = '<span class="marke">Nr. ' + (idx+1) + " von " + offen.length + "</span>";
      var dvor = strecken[h.id];
      if (dvor !== undefined && dvor < 1) marken += '<span class="marke">Startpunkt</span>';
      else if (dvor !== undefined) marken += '<span class="marke">' + weg(dvor) + "</span>";
      else if (idx > 0) marken += '<span class="marke">' + weg(meter(offen[idx-1], h)) + " vom vorigen</span>";
      if (hatStoerung(h.id)) marken += '<span class="marke stoerung">Termin doppelt belegt</span>';
      if (wvVon(h.id)) marken += '<span class="marke w' + (faellig(h.id) ? " faellig" : "") + '">' +
        (faellig(h.id) ? "Heute dran" + (wzVon(h.id) ? " um " + wzVon(h.id) : "")
                       : "Wieder " + wannText(h.id)) + "</span>";
      if (z === "arbeit") marken += '<span class="marke w" style="border-color:var(--akzent);color:var(--akzent)">' +
        (werVon(h.id) === ich ? "Du bist dran" : werVon(h.id) + " ist dran") + "</span>";
      if (idx > 0 && offen[idx-1].k !== h.k) marken += '<span class="marke ruf">Elbseite wechseln</span>';
      if (h.i) marken += '<span class="marke chef">Chef meist da</span>';
      if (!h.g) marken += '<span class="marke ruf">vorher anrufen</span>';

      k.innerHTML =
        '<button class="stern' + (gemerkt(h.id) ? " an" : "") + '" type="button" id="btnStern" aria-label="Merken">' + STERN + "</button>" +
        '<div class="eyebrow">' + (faellig(h.id) ? "Heute wieder dran" : "Als Nächstes") + "</div>" +
        "<h2>" + h.n + "</h2>" +
        '<div class="adr">' + h.s + (h.p ? ", " + h.p + " Dresden" : "") + "</div>" +
        '<div class="marken">' + marken + "</div>" +
        '<a class="los" href="' + karteLink(h) + '" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>' +
          "Navigation starten</a>" +
        '<div class="zweit">' +
          (h.t ? '<a class="knopf" href="tel:' + h.t.replace(/\s/g,"") + '">Anrufen</a>'
               : '<span class="knopf aus">Keine Nummer</span>') +
          '<button class="knopf" type="button" id="btnSkip">Überspringen</button>' +
        "</div>" +
        '<div class="abfrage"><p>Wie ist es gelaufen?</p><div class="stand">' +
          '<button class="sb a' + (z==="arbeit"?" an":"") + '" type="button" data-s="arbeit">In Bearbeitung<small>Gespräch läuft, noch offen</small></button>' +
          '<button class="sb w' + (z==="warten"?" an":"") + '" type="button" data-s="warten">Wiedervorlage<small>Chef weg, Bedenkzeit</small></button>' +
          '<button class="sb j' + (z==="zugesagt"?" an":"") + '" type="button" data-s="zugesagt">Zimmer zugesagt<small>Du darfst filmen</small></button>' +
          '<button class="sb n' + (z==="abgelehnt"?" an":"") + '" type="button" data-s="abgelehnt">Kein Interesse<small>Abgehakt</small></button>' +
        "</div>" +
        (z === "warten" ? wannBlock(h) : "") +
        '<textarea class="notiz" id="notiz" rows="2" placeholder="Was wurde gesagt? Name des Chefs?"></textarea>' +
        "</div>";
      b.appendChild(k);

      k.querySelector("#notiz").value = notizVon(h.id);
      k.querySelector("#notiz").addEventListener("input", function(){
        if(!stand[h.id]) stand[h.id] = {};
        stand[h.id].n = this.value; sichern();
      });
      k.querySelector("#btnStern").addEventListener("click", function(){
        var an = merken(h.id);
        sagen(an ? h.n + " gemerkt" : "Merken entfernt");
        bauen();
      });
      k.querySelector("#btnSkip").addEventListener("click", function(){
        var o = liste_offen(), i = o.indexOf(nachId(aktuell));
        aktuell = o[(i+1) % o.length].id; bauen();
        window.scrollTo({top:0, behavior:"smooth"});
      });
      k.querySelectorAll(".sb").forEach(function(btn){
        btn.addEventListener("click", function(){
          var neu = this.dataset.s;
          if (neu === zustand(h.id)){ setzen(h.id, "offen"); sagen("Zurückgesetzt"); bauen(); return; }
          if (neu === "warten"){
            wvSetzen(h.id, inTagen(2));
            sagen("Wähl unten den Tag — dann steht es unter „Heute dran“");
            bauen(); return;
          }
          setzen(h.id, neu);
          sagen(h.n + " steht jetzt oben unter „" + ZUSTAENDE[neu].wo + "“");
          if (neu === "zugesagt" || neu === "abgelehnt") aktuell = null;
          bauen(); window.scrollTo({top:0, behavior:"smooth"});
        });
      });
      if (z === "warten") wannVerdrahten(k, h);

      if (routeInfo){
        var rb = document.createElement("div");
        rb.className = "routebox";
        rb.innerHTML = "<b>" + routeInfo.tag.haeuser + "</b><span><strong>Häuser an einem Tag</strong>" +
          (routeInfo.von ? " ab " + routeInfo.von : "") + "<br>auf " + weg(routeInfo.tag.meter) +
          " Laufweg. Alle " + routeInfo.anzahl + ": " + weg(routeInfo.gesamt) + "</span>" +
          '<button class="zu" type="button" aria-label="Ausblenden">×</button>';
        rb.querySelector(".zu").addEventListener("click", function(){ routeInfo = null; bauen(); });
        b.appendChild(rb);
      }

      var rest = offen.slice(idx+1).concat(offen.slice(0, idx));
      var faellige = rest.filter(function(x){ return faellig(x.id); });
      var normal = rest.filter(function(x){ return !faellig(x.id); });
      if (faellige.length) zeigeListe("Heute wieder dran", faellige, b, false, true);
      if (normal.length) zeigeListe("Danach", normal, b, false, false);
    }
    if (filter === "alle" && !suchwort){
      var abgehakt = HOTELS.filter(function(x){ return fertig(x.id); });
      if (abgehakt.length) zeigeListe("Abgehakt", abgehakt, b, true, false);
    }
  }

  function wannBlock(h){
    var w = wvVon(h.id), z = wzVon(h.id);
    var opt = [["morgen",1],["in 3 Tagen",3],["in einer Woche",7],["in 2 Wochen",14]];
    var kn = opt.map(function(o){
      return '<button type="button" data-t="' + o[1] + '"' +
             (w === inTagen(o[1]) ? ' class="an"' : "") + ">" + o[0] + "</button>";
    }).join("");
    // Zehn bis zwölf ist das beste Fenster: Abreise durch, Anreise noch nicht da.
    var zeiten = ["10:00","11:00","14:00","16:00"];
    var zk = zeiten.map(function(x){
      var klasse = z === x ? "an" : (stoerung(h.id, w || inTagen(1), x) ? "belegt" : "");
      return '<button type="button" data-z="' + x + '"' + (klasse ? ' class="' + klasse + '"' : "") +
             ">" + x + "</button>";
    }).join("");
    return '<div class="wann">' +
      "<p>Wann gehst du wieder hin?</p>" +
      '<div class="wannreihe">' + kn + "</div>" +
      '<div class="genau">' +
        '<div><label for="wvDatum">Datum</label><input type="date" id="wvDatum" value="' + (w || "") + '"></div>' +
        '<div><label for="wvZeit">Uhrzeit</label><input type="time" id="wvZeit" value="' + (z || "") + '"></div>' +
      "</div>" +
      '<div class="zeitwahl">' + zk +
        (z ? '<button type="button" data-z="">Zeit löschen</button>' : "") +
      "</div>" + warnkasten(h) + "</div>";
  }
  function warnkasten(h){
    var k = letzteStoerung;
    // Entweder ein gerade abgelehnter Versuch, oder ein bereits bestehender Konflikt
    if (!k || k.id !== h.id){
      var b = stoerung(h.id, wvVon(h.id), wzVon(h.id));
      if (!b) return "";
      return '<div class="konflikt"><p>Termin überschneidet sich</p><span>' +
        "Zur selben Zeit steht <strong>" + b.haus.n + "</strong> um " + b.zeit +
        " Uhr. Zwischen zwei Terminen sollten mindestens " + ABSTAND + " Minuten liegen.</span>" +
        (naechsterFrei(h.id, wvVon(h.id), wzVon(h.id))
          ? '<button type="button" data-frei="' + naechsterFrei(h.id, wvVon(h.id), wzVon(h.id)) +
            '">Stattdessen ' + naechsterFrei(h.id, wvVon(h.id), wzVon(h.id)) + " Uhr</button>"
          : "") + "</div>";
    }
    return '<div class="konflikt"><p>' + k.zeit + " Uhr geht nicht</p><span>" +
      "<strong>" + k.mit.haus.n + "</strong> steht schon um " + k.mit.zeit +
      " Uhr — das sind nur " + k.mit.abstand + " Minuten dazwischen. Der Termin wurde nicht gesetzt.</span>" +
      (k.frei ? '<button type="button" data-frei="' + k.frei + '">Stattdessen ' + k.frei + " Uhr</button>" : "") +
      "</div>";
  }

  function wannVerdrahten(k, h){
    k.querySelectorAll(".wannreihe button").forEach(function(btn){
      btn.addEventListener("click", function(){
        var ok = wvSetzen(h.id, inTagen(parseInt(this.dataset.t, 10)));
        sagen(ok ? "Wieder dran " + wannText(h.id) : "An dem Tag ist die Uhrzeit schon belegt");
        bauen();
      });
    });
    var dat = k.querySelector("#wvDatum");
    if (dat) dat.addEventListener("change", function(){
      if (!this.value) return;
      var ok = wvSetzen(h.id, this.value);
      sagen(ok ? "Wieder dran " + wannText(h.id) : "An dem Tag ist die Uhrzeit schon belegt");
      bauen();
    });
    var zeit = k.querySelector("#wvZeit");
    if (zeit) zeit.addEventListener("change", function(){
      var ok = wzSetzen(h.id, this.value);
      sagen(!ok ? "Termin überschneidet sich — nicht gesetzt"
                : (this.value ? "Wieder dran " + wannText(h.id) : "Uhrzeit entfernt"));
      bauen();
    });
    k.querySelectorAll(".zeitwahl button").forEach(function(btn){
      btn.addEventListener("click", function(){
        var ok = wzSetzen(h.id, this.dataset.z);
        sagen(!ok ? "Termin überschneidet sich — nicht gesetzt"
                  : (this.dataset.z ? "Wieder dran " + wannText(h.id) : "Uhrzeit entfernt"));
        bauen();
      });
    });
    var frei = k.querySelector(".konflikt button[data-frei]");
    if (frei) frei.addEventListener("click", function(){
      wzSetzen(h.id, this.dataset.frei);
      sagen("Wieder dran " + wannText(h.id));
      bauen();
    });
  }

  function zeigeListe(titel, arr, buehne, istFertig, istFaellig){
    var a = document.createElement("div");
    a.className = "abschnitt" + (istFaellig ? " faellig" : "");
    a.innerHTML = "<h3>" + titel + " (" + arr.length + ")</h3><hr>";
    buehne.appendChild(a);
    arr.forEach(function(h, i){
      var z = zustand(h.id);
      var r = document.createElement("button");
      r.type = "button";
      r.className = "reihe s-" + z + (istFertig ? " fertig" : "") + (hatStoerung(h.id) ? " stoerung" : "");
      var rechts = "";
      if (gemerkt(h.id)) rechts += '<svg class="stern2" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg>';
      if (wvVon(h.id)) rechts += '<span class="wv' + (hatStoerung(h.id) ? " stoerung" : (faellig(h.id) ? " jetzt2" : "")) + '">' +
        datumText(wvVon(h.id)) + (wzVon(h.id) ? " " + wzVon(h.id) : "") + "</span>";
      else if (z === "arbeit" && werVon(h.id)) rechts += '<span class="wer">' + werVon(h.id) + "</span>";
      else if (!istFertig && strecken[h.id] !== undefined) rechts += '<span class="km">' + weg(strecken[h.id]) + "</span>";
      else if (!istFertig && h.i) rechts += '<span class="km">Chef</span>';
      var unten = h.s + (notizVon(h.id) ? " · " + notizVon(h.id) : "");
      r.innerHTML = (istFertig ? "" : '<span class="nr">' + (i+1) + "</span>") +
        '<span class="txt"><span class="nm">' + h.n + '</span><span class="st">' + unten + "</span></span>" +
        '<span class="rechts">' + rechts + "</span>";
      r.addEventListener("click", function(){
        aktuell = h.id;
        if (istFertig) setzen(h.id, "offen");
        bauen(); window.scrollTo({top:0, behavior:"smooth"});
      });
      buehne.appendChild(r);
    });
  }

  function anzeigeIch(){
    document.getElementById("ichName").textContent = ich;
    document.getElementById("kugel").textContent = (ich[0] || "?").toUpperCase();
  }

  document.getElementById("btnIch").addEventListener("click", function(){
    var n = prompt("Wer läuft gerade? Der Name steht an jedem Haus, das du bearbeitest.", ich);
    if (n === null) return;
    n = n.trim(); if (!n) return;
    ich = n; localStorage.setItem(SP_ICH, ich); anzeigeIch(); bauen();
  });
  function filterKlick(ev){
    var b = ev.target.closest("button"); if (!b || !b.dataset.f) return;
    // Nochmal auf denselben Filter tippen bringt zurueck zur Gesamtansicht
    filter = (filter === b.dataset.f && b.dataset.f !== "alle") ? "alle" : b.dataset.f;
    aktuell = null; bauen();
    window.scrollTo({top:0, behavior:"smooth"});
  }
  document.getElementById("filter").addEventListener("click", filterKlick);
  document.getElementById("tally").addEventListener("click", filterKlick);
  var su = document.getElementById("suche");
  su.addEventListener("input", function(){
    suchwort = this.value.trim().toLowerCase();
    aktuell = null; bauen();
  });

  function routeAnwenden(pfad, von, wieHeisst, alleOffen){
    var gesamt = streckenSetzen(pfad, von);
    var tag = tagesreichweite(pfad, von);
    var uebrig = HOTELS.filter(function(x){ return pfad.indexOf(x) < 0; }).map(function(x){ return x.id; });
    reihenfolge = pfad.map(function(x){ return x.id; }).concat(uebrig);
    aktuell = pfad.length ? pfad[0].id : null;
    routeInfo = {gesamt: gesamt, tag: tag, anzahl: pfad.length, von: wieHeisst};
    sagen(tag.haeuser + " Häuser an einem Tag ab " + wieHeisst);
    bauen(); window.scrollTo({top:0, behavior:"smooth"});
  }

  document.getElementById("btnHier").addEventListener("click", function(){
    var h = nachId(aktuell) || liste_offen()[0];
    if (!h){ sagen("Nichts offen"); return; }
    var rest = liste_offen().filter(function(x){ return x.id !== h.id; });
    var pfad = [h].concat(routeRechnen(rest, h));
    routeAnwenden(pfad, h, h.n);
    strecken[h.id] = 0;
    bauen();
  });

  document.getElementById("btnGps").addEventListener("click", function(){
    var b = this;
    if (!navigator.geolocation){ sagen("Standort geht hier nicht — nimm „Ab diesem Haus“"); return; }
    b.textContent = "Suche Standort…";
    navigator.geolocation.getCurrentPosition(function(pos){
      var mir = {la: pos.coords.latitude, lo: pos.coords.longitude};
      mir.k = elbseite(mir.la, mir.lo);
      b.textContent = "Rechne…";
      setTimeout(function(){
        var offen = liste_offen();
        if (!offen.length){ b.textContent = "Ab meinem Standort"; sagen("Nichts offen"); return; }
        routeAnwenden(routeRechnen(offen, mir), mir, "deinem Standort");
        b.textContent = "Ab meinem Standort";
      }, 30);
    }, function(f){
      b.textContent = "Ab meinem Standort";
      sagen(f.code === 1 ? "Standort gesperrt — nimm „Ab diesem Haus“"
                         : "Standort nicht gefunden — nimm „Ab diesem Haus“");
    }, {enableHighAccuracy:true, timeout:12000});
  });

  document.getElementById("btnExport").addEventListener("click", function(){
    var z = ["Stand der Runde Dresden — " + new Date().toLocaleDateString("de-DE"), ""];
    ["zugesagt","warten","arbeit","abgelehnt"].forEach(function(s){
      var g = HOTELS.filter(function(h){ return zustand(h.id) === s; });
      if (!g.length) return;
      z.push(ZUSTAENDE[s].kurz.toUpperCase() + " (" + g.length + ")");
      g.forEach(function(h){
        z.push("  " + h.id + "  " + h.n +
          (wvVon(h.id) ? "  [wieder " + wvVon(h.id) + (wzVon(h.id) ? " " + wzVon(h.id) : "") + "]" : "") +
          (werVon(h.id) ? "  [" + werVon(h.id) + "]" : "") +
          (gemerkt(h.id) ? "  [gemerkt]" : "") +
          (notizVon(h.id) ? "  — " + notizVon(h.id) : ""));
      });
      z.push("");
    });
    var gm = HOTELS.filter(function(h){ return gemerkt(h.id) && zustand(h.id) === "offen"; });
    if (gm.length){
      z.push("GEMERKT, noch nicht angesprochen (" + gm.length + ")");
      gm.forEach(function(h){ z.push("  " + h.id + "  " + h.n); });
      z.push("");
    }
    z.push("offen: " + HOTELS.filter(function(h){ return zustand(h.id)==="offen"; }).length +
           " von " + HOTELS.length);
    var text = z.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(function(){ sagen("Stand kopiert — schick ihn mir"); },
                                               function(){ sagen("Kopieren ging nicht"); });
    else sagen("Kopieren ging nicht");
  });

  // Ist heute etwas fällig? Dann direkt dort anfangen.
  var heuteFaellig = HOTELS.filter(function(h){ return faellig(h.id); });
  if (heuteFaellig.length){
    aktuell = heuteFaellig[0].id;
    setTimeout(function(){ sagen(heuteFaellig.length + " Haus/Häuser heute wieder dran"); }, 500);
  }
  anzeigeIch();
  bauen();
})();
</script>
